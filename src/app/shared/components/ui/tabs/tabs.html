<nav class="tabs-nav">
      @for (item of items; track item.id) {
        <button class="tab-btn" 
                [class.active]="current === item.id"
                (click)="selectTab(item.id)">
          <span *ngIf="item.icon" class="material-icons-round icon">{{ item.icon }}</span>
          {{ item.label }}
        </button>
      }
    </nav>
