<div class="stat-card" [class]="variant()">
  <div class="icon-box">
    <span class="material-icons-round">{{ icon() }}</span>
  </div>
  <div class="content">
    <span class="label">{{ label() }}</span>
    <h3 class="value">{{ value() }}</h3>
  </div>
  <div class="bg-icon">
    <span class="material-icons-round">{{ icon() }}</span>
  </div>
</div>
