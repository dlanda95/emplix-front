<div class="tabs-container" [class.has-overflow]="hasOverflow()" (window:resize)="onResize()">
  <nav #navEl class="tabs-nav" [ngClass]="align" (scroll)="checkOverflow()">

    <div class="sliding-indicator"
         [style.left]="indicatorLeft()"
         [style.width]="indicatorWidth()">
    </div>

    @for (item of items; track item.id) {
      <button #tabBtn
              class="tab-btn"
              [class.active]="current === item.id"
              (click)="selectTab(item.id)">

        @if (item.icon) {
          <span class="material-icons-round icon">{{ item.icon }}</span>
        }
        <span class="label">{{ item.label }}</span>

      </button>
    }

  </nav>
</div>
