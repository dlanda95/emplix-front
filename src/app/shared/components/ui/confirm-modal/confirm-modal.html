<app-modal [isOpen]="isOpen()" [title]="title()" (close)="cancelled.emit()">

  <div style="display:flex; flex-direction:column; align-items:center; gap:var(--space-3); padding-bottom:var(--space-2);">
    <div class="cm__icon" [class]="confirmVariant()">
      <span class="material-icons-round">{{ icon() }}</span>
    </div>
    @if (message()) {
      <p class="cm__message">{{ message() }}</p>
    }
  </div>

  <ng-container modal-actions>
    <app-button variant="ghost" (clicked)="cancelled.emit()">Cancelar</app-button>
    <app-button [variant]="confirmVariant()" (clicked)="confirmed.emit()">{{ confirmLabel() }}</app-button>
  </ng-container>

</app-modal>
