<div class="input-group">
      <label class="input-label">{{ label }}</label>
      <input 
        class="input-control" 
        [type]="type" 
        [placeholder]="placeholder"
        [(ngModel)]="value"
        (ngModelChange)="onChange($event)"
        (blur)="onTouched()"
        [disabled]="disabled"
      >
    </div>
