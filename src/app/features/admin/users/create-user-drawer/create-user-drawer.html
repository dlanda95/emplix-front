<app-drawer
  [isOpen]="isOpen"
  title="Crear Usuario del Sistema"
  subtitle="Acceso al panel sin ficha de empleado (auditor, admin externo...)"
  width="sm"
  (close)="onClose()">

  @if (success) {
    <div class="success-screen">
      <div class="success-icon">
        <span class="material-icons-round">how_to_reg</span>
      </div>
      <h3 class="success-title">¡Usuario creado!</h3>
      <p class="success-desc">El usuario ya puede ingresar al sistema.</p>
      <div class="credentials-card">
        <div class="credentials-row">
          <span class="credentials-label">Correo</span>
          <span class="credentials-value">{{ createdEmail }}</span>
        </div>
      </div>
    </div>
    <div drawer-footer>
      <app-button variant="primary" (click)="confirmSuccess()">Entendido</app-button>
    </div>

  } @else {
    <form [formGroup]="form">
      @if (errorMsg) {
        <app-banner variant="error" icon="error" [title]="errorMsg"></app-banner>
      }

      <app-form-section title="Datos del usuario" icon="person">
        <app-form-row>
          <app-input label="Nombres *" formControlName="firstName" placeholder="Ej. Carlos"></app-input>
          <app-input label="Apellidos *" formControlName="lastName" placeholder="Ej. Ramírez"></app-input>
        </app-form-row>
        <app-input label="Correo electrónico *" formControlName="email" type="email"
          placeholder="usuario@empresa.com"></app-input>
      </app-form-section>

      <app-form-section title="Acceso y permisos" icon="shield_person">
        <app-select label="Rol en el sistema *" formControlName="role"
          [options]="roleOptions" placeholder="Seleccionar rol"></app-select>
        <app-input label="Contraseña *" formControlName="password" type="password"
          placeholder="Mínimo 8 caracteres"></app-input>
        <p class="hint">
          <span class="material-icons-round">info</span>
          Este usuario no tendrá ficha de empleado. Solo accederá al panel administrativo.
        </p>
      </app-form-section>
    </form>

    <div drawer-footer>
      <div class="drawer-actions">
        <app-button variant="ghost" (click)="onClose()">Cancelar</app-button>
        <app-button variant="primary" icon="person_add" [loading]="saving" (click)="submit()">
          Crear usuario
        </app-button>
      </div>
    </div>
  }

</app-drawer>
