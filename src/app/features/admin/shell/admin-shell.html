<div class="admin-layout">

  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="sidebar-brand">
      <span class="material-icons-round">corporate_fare</span>
      <span>Emplix HR</span>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
         class="nav-item">
        <span class="material-icons-round">dashboard</span>
        <span>Panel</span>
      </a>
      <a routerLink="/admin/candidatos" routerLinkActive="active" class="nav-item">
        <span class="material-icons-round">group_add</span>
        <span>Candidatos</span>
      </a>
      <a routerLink="/admin/colaboradores" routerLinkActive="active" class="nav-item">
        <span class="material-icons-round">badge</span>
        <span>Colaboradores</span>
      </a>
      <a routerLink="/admin/solicitudes" routerLinkActive="active" class="nav-item">
        <span class="material-icons-round">task_alt</span>
        <span>Solicitudes</span>
      </a>
      <a routerLink="/admin/organizacion" routerLinkActive="active" class="nav-item">
        <span class="material-icons-round">account_tree</span>
        <span>Organización</span>
      </a>
      <a routerLink="/admin/usuarios" routerLinkActive="active" class="nav-item">
        <span class="material-icons-round">manage_accounts</span>
        <span>Usuarios</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-pill">
        <span class="material-icons-round">account_circle</span>
        <span>{{ auth.currentUser()?.firstName }}</span>
      </div>
      <button class="btn-logout" (click)="logout()">
        <span class="material-icons-round">logout</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="admin-main">
    <router-outlet></router-outlet>
  </main>

</div>
