<div style="display:flex; flex-direction:column; gap:var(--space-8); padding-bottom:var(--space-8);">

  <app-page-header
    title="Configuración"
    subtitle="Administra el acceso, los permisos y la identidad corporativa de tu plataforma">
  </app-page-header>

  <app-col-grid [cols]="3">
    @for (card of cards; track card.route) {
      @if (!card.adminOnly || perms.canManageConfig()) {
        <app-nav-card
          [icon]="card.icon"
          [color]="card.color"
          [title]="card.title"
          [description]="card.description"
          [tags]="card.tags"
          (clicked)="navigate(card.route)">
        </app-nav-card>
      }
    }
  </app-col-grid>

</div>
