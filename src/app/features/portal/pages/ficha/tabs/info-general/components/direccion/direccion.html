@if (profile(); as data) {

  <app-split-layout>
    
    <ng-container main>
      
      <app-section-card title="Ubicación Domiciliaria" [columns]="1">
        <app-field label="Dirección Registrada" 
                   [value]="data.address">
        </app-field>

        </app-section-card>

      <app-section-card title="En Caso de Emergencia" [columns]="2">
        <app-field label="Nombre de Contacto" 
                   [value]="data.emergencyContactName">
        </app-field>
        
        <app-field label="Teléfono de Contacto" 
                   [value]="data.emergencyContactPhone">
        </app-field>
      </app-section-card>

    </ng-container>

    <ng-container side>
      <app-map-widget 
        [address]="data.address || 'Sin dirección registrada'" 
        city="Lima, Perú"> </app-map-widget>
    </ng-container>

  </app-split-layout>

} @else {
  <div style="padding: 4rem; text-align: center; color: var(--text-secondary);">
    Cargando dirección...
  </div>
}
