@if (profile(); as data) {

  <app-toolbar-layout>
    <ng-container main>
      <app-page-header title="Domicilio" subtitle="Dirección de residencia del colaborador."></app-page-header>
    </ng-container>
    <ng-container actions>
      <app-button variant="secondary" icon="edit_location" (clicked)="openModal()">
        Actualizar Dirección
      </app-button>
    </ng-container>
  </app-toolbar-layout>

  <app-split-layout class="fade-in">

    <ng-container main>
      <app-section-card title="Ubicación Domiciliaria" [columns]="2">
        <app-field label="Dirección"    [value]="data.address"></app-field>
        <app-field label="Distrito"     [value]="data.district"></app-field>
        <app-field label="Departamento" [value]="data.departmentdirec"></app-field>
        <app-field label="Referencia"   [value]="data.addressRef"></app-field>
      </app-section-card>
    </ng-container>

    <ng-container side>
      <app-map-widget
        [address]="data.address || 'Lima, Perú'"
        city="Perú">
      </app-map-widget>
    </ng-container>

  </app-split-layout>

  <app-modal
    [isOpen]="isModalOpen()"
    title="Actualizar Dirección"
    (close)="closeModal()">

    <div style="display:flex;flex-direction:column;gap:1rem;">

      <!-- Toggle: misma dirección que documento de identidad -->
      <label style="display:flex;align-items:center;gap:0.625rem;cursor:pointer;padding:0.75rem;background:var(--bg-surface-alt,var(--bg-surface));border:1px solid var(--border-color);border-radius:var(--radius-md);">
        <input type="checkbox" (change)="toggleSameAsDoc($event)" [checked]="sameAsDoc()">
        <span>Mi domicilio actual es el mismo que figura en mi documento de identidad</span>
      </label>

      @if (sameAsDoc() && !data.docAddress) {
        <app-banner variant="warning" icon="info" title="Sin dirección del documento registrada">
          <p>Primero registra tu dirección en <strong>Mis Datos → Documentos de Identidad</strong> y luego vuelve aquí.</p>
        </app-banner>
      }

      <form [formGroup]="addressForm" style="display:flex;flex-direction:column;gap:0.75rem;">

        <app-input
          label="Dirección (Calle / Av. / Jr. + Nro. + Urb.)"
          formControlName="address"
          placeholder="Ej. Av. Larco 123, Urb. El Olivar">
        </app-input>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;">
          <app-input
            label="Distrito"
            formControlName="district"
            placeholder="Ej. Miraflores">
          </app-input>
          <app-input
            label="Departamento"
            formControlName="departmentdirec"
            placeholder="Ej. Lima">
          </app-input>
        </div>

        <app-input
          label="Referencia (opcional)"
          formControlName="addressRef"
          placeholder="Ej. Frente al parque central">
        </app-input>

      </form>
    </div>

    <ng-container modal-actions>
      <app-button variant="ghost" (clicked)="closeModal()">Cancelar</app-button>
      <app-button
        variant="primary"
        [loading]="isSubmitting()"
        [disabled]="addressForm.invalid || isSubmitting()"
        (clicked)="submitAddressUpdate()">
        Guardar Dirección
      </app-button>
    </ng-container>

  </app-modal>

}
