@if (profile(); as data) {

  <app-change-request-bar
    section="Contacto"
    sectionIcon="contact_phone"
    description="Teléfono, email personal y contacto de emergencia."
    [isPending]="false"
    actionLabel="Actualizar"
    actionIcon="edit"
    [requiresApproval]="false"
    (editRequested)="openModal()">
  </app-change-request-bar>

  @if (saved()) {
    <div class="cbar-success-toast">
      <span class="material-icons-round">check_circle</span>
      Datos de contacto actualizados correctamente
    </div>
  }

  <app-section-card title="Contacto Directo" [columns]="3">
    <app-field label="Teléfono" [value]="data.phone"></app-field>
    <app-field label="Celular"  [value]="data.cellPhone"></app-field>
    <app-field label="Email"    [value]="data.personalEmail"></app-field>
  </app-section-card>

  <app-section-card title="Contacto de Emergencia" [columns]="3">
    <app-field label="Nombre del Contacto" [value]="data.emergencyName"></app-field>
    <app-field label="Vínculo"             [value]="data.emergencyRel"></app-field>
    <app-field label="Teléfono"            [value]="data.emergencyPhone"></app-field>
  </app-section-card>

  <app-modal [isOpen]="isModalOpen()" title="Actualizar Contacto" (close)="closeModal()">

    <form [formGroup]="contactForm" style="display:flex;flex-direction:column;gap:0.75rem;">
      <app-form-section title="Contacto directo"></app-form-section>
      <app-col-grid [cols]="3">
        <app-input label="Teléfono"       formControlName="phone"          placeholder="Ej. 01-234-5678"></app-input>
        <app-input label="Celular"        formControlName="cellPhone"      placeholder="Ej. 987 654 321"></app-input>
        <app-input label="Email Personal" formControlName="personalEmail"  type="email" placeholder="correo@ejemplo.com"></app-input>
      </app-col-grid>

      <app-form-section title="Contacto de emergencia"></app-form-section>
      <app-col-grid [cols]="3">
        <app-input label="Nombre del Contacto" formControlName="emergencyName"  placeholder="Nombre completo"></app-input>
        <app-input label="Vínculo"             formControlName="emergencyRel"   placeholder="Ej. Madre, Esposo/a"></app-input>
        <app-input label="Teléfono"            formControlName="emergencyPhone" placeholder="Ej. 987 654 321"></app-input>
      </app-col-grid>
    </form>

    <ng-container modal-actions>
      <app-button variant="ghost"   (clicked)="closeModal()">Cancelar</app-button>
      <app-button
        variant="primary"
        icon="save"
        [loading]="isSubmitting()"
        [disabled]="contactForm.invalid || isSubmitting()"
        (clicked)="submit()">
        Guardar
      </app-button>
    </ng-container>

  </app-modal>

}
