<div style="display:flex; flex-direction:column; min-height:100%">

  <app-tabs-card
    [items]="tabItems()"
    [current]="activeTab()"
    (currentChange)="activeTab.set($event)"
    align="fill">
  </app-tabs-card>

  <div style="padding: 1.25rem 1.75rem; flex: 1">

    @switch (activeTab()) {

      @case ('mis-datos') {
        <app-mis-datos #misDatos></app-mis-datos>
      }

      @case ('direccion') {
        <app-direccion></app-direccion>
      }

      @case ('contacto') {
        <app-contacto></app-contacto>
      }

      @case ('financiero') {
        <app-financiero></app-financiero>
      }

      @case ('familia') {
        <app-familia></app-familia>
      }

      @case ('estudios') {
        <app-estudios></app-estudios>
      }

    }
  </div>

</div>
