<div class="ig-layout">

  <app-tabs-card
    [items]="tabItems()"
    [current]="activeTab()"
    (currentChange)="activeTab.set($event)"
    align="fill">
  </app-tabs-card>

  <div class="ig-content">

    @switch (activeTab()) {

      @case ('mis-datos') {
        <app-mis-datos #misDatos></app-mis-datos>
      }

      @case ('direccion') {
        <app-direccion></app-direccion>
      }

      @case ('contacto') {
        <app-contacto></app-contacto>
      }

      @case ('financiero') {
        <app-financiero></app-financiero>
      }

      @case ('familia') {
        <app-familia></app-familia>
      }

      @case ('estudios') {
        <app-estudios></app-estudios>
      }

    }
  </div>

</div>
