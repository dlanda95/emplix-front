<div class="info-general-layout">
  
  <app-tabs-card 
    [items]="tabItems" 
    [(current)]="activeTab">
  </app-tabs-card>

  <div class="content-wrapper">
    
    @switch (activeTab) {
      
      @case ('mis-datos') {
        <app-mis-datos></app-mis-datos>
      }

      @case ('direccion') {
        <app-direccion></app-direccion>
      }

      @case ('contacto') {
        <p>Próximamente...</p>
      }

    }
  </div>
</div>
